name: One-shot rustfmt fixer

on:
  push:
    branches:
      - milestone/virtio-rng-pci-request

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply rustfmt and remove formatter workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/virtio-rng-pci-request
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and self-remove
        shell: bash
        run: |
          cargo fmt --all
          git rm .github/workflows/format-fix.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'Apply rustfmt and remove formatter workflow'
          git push origin HEAD:milestone/virtio-rng-pci-request
