name: Strict KVM two virtio-blk full-controller checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'src/kvm/irqchip_snapshot.rs'
      - 'src/kvm/lapic_uapi.rs'
      - 'src/vcpu/lapic_checkpoint.rs'
      - 'src/vcpu/mp_state.rs'
      - 'src/mmio.rs'
      - 'src/mmio/multi_device/virtio_blk_atomic_bus.rs'
      - 'src/pci/virtio_blk.rs'
      - 'src/pci/virtio_blk_checkpoint.rs'
      - 'src/state_snapshot/page_set.rs'
      - 'src/state_snapshot/page_set/controller.rs'
      - 'src/state_snapshot/page_set/full_controller.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk_guest.rs'
      - 'src/bin/full-controller-two-virtio-blk-checkpoint.rs'
      - 'tests/full_controller_two_virtio_blk_checkpoint_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/full-controller-two-virtio-blk-checkpoint.yml'
  pull_request:
    paths:
      - 'src/kvm/irqchip_snapshot.rs'
      - 'src/kvm/lapic_uapi.rs'
      - 'src/vcpu/lapic_checkpoint.rs'
      - 'src/vcpu/mp_state.rs'
      - 'src/mmio.rs'
      - 'src/mmio/multi_device/virtio_blk_atomic_bus.rs'
      - 'src/pci/virtio_blk.rs'
      - 'src/pci/virtio_blk_checkpoint.rs'
      - 'src/state_snapshot/page_set.rs'
      - 'src/state_snapshot/page_set/controller.rs'
      - 'src/state_snapshot/page_set/full_controller.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk_guest.rs'
      - 'src/bin/full-controller-two-virtio-blk-checkpoint.rs'
      - 'tests/full_controller_two_virtio_blk_checkpoint_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/full-controller-two-virtio-blk-checkpoint.yml'

permissions:
  contents: read

jobs:
  strict-kvm-two-virtio-blk-controller-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build two-device checkpoint proof
        run: cargo build --quiet --bin full-controller-two-virtio-blk-checkpoint
      - name: Execute two-device checkpoint proof on KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s target/debug/full-controller-two-virtio-blk-checkpoint)"
          printf '%s\n' "$output"

          grep -F 'two-virtio checkpoint page: 0x30000' <<<"$output"
          grep -F 'two-virtio checkpoint bars: [268435456, 268439552]' <<<"$output"
          grep -F 'two-virtio checkpoint captured statuses: [1, 3]' <<<"$output"
          grep -F 'two-virtio checkpoint mutation exact: page=false vcpu=false master-pic=false slave-pic=false ioapic=false lapic=false first=false second=false' <<<"$output"
          grep -F 'two-virtio checkpoint restore exact: page=true vcpu=true master-pic=true slave-pic=true ioapic=true lapic=true first=true second=true' <<<"$output"
          grep -F 'two-virtio checkpoint restored statuses: [1, 3]' <<<"$output"
          grep -F 'two-virtio checkpoint proof: [65, 83, 66, 74, 77, 68]' <<<"$output"

          completion="$(grep -F 'two-virtio checkpoint completion rflags:' <<<"$output")"
          rflags_hex="${completion##*: }"
          [[ "$rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          rflags=$((rflags_hex))
          (( (rflags & 0x2) == 0x2 ))
          (( (rflags & 0x200) == 0x200 ))
