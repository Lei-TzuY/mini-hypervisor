name: Temporary kvm module formatter

on:
  push:
    branches: [milestone/task-wait-dirty-capture]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/task-wait-dirty-capture
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and verify scope
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F ' M src/kvm/mod.rs'
      - name: Commit formatter result
        shell: bash
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/kvm/mod.rs
          git commit -m 'Format dirty-log helper export'
          git push origin HEAD:milestone/task-wait-dirty-capture
