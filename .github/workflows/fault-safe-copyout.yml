name: Strict KVM fault-safe copyout recovery

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/copyout.rs'
      - 'src/bin/fault-safe-copyout.rs'
      - 'tests/fault_safe_copyout_guest.rs'
      - 'src/privilege.rs'
      - 'src/syscall.rs'
      - 'src/kvm/msr.rs'
      - 'src/kvm/msr/**'
      - 'src/vcpu.rs'
      - 'src/vcpu/**'
      - 'src/long_mode.rs'
      - 'src/memory.rs'
      - 'src/lib.rs'
      - 'ROADMAP.md'
      - '.github/workflows/fault-safe-copyout.yml'

permissions:
  contents: read

jobs:
  fault-safe-copyout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict KVM fault-safe copyout proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s cargo run --quiet --bin fault-safe-copyout)"
          printf '%s\n' "$output"

          grep -F 'copyout proof: [87, 70, 68]' <<<"$output"
          grep -F 'copyout results: good=0x0 bad=0xfffffffffffffff2 readback=0xa5 memory=0xa5' <<<"$output"
          grep -F 'copyout page fault: cr2=0x400000 error=0x2 rip=0x1200d cs=0x8 rflags=0x10002' <<<"$output"
          grep -F 'copyout terminal frame: rip=0x11032 cs=0x23 rflags=0x202 rsp=0x1fd000 ss=0x1b' <<<"$output"
          grep -F 'copyout terminal: rsp=0x1fdfd8 cs=0x8 rflags=' <<<"$output"
          grep -F ' cr2=0x400000' <<<"$output"
          grep -F 'copyout bad PD entry: 0x0' <<<"$output"
          grep -F 'copyout terminal report: rip=0x13005 rflags=' <<<"$output"

          msrs="$(grep -F 'copyout MSRs:' <<<"$output")"
          efer_hex="$(sed -n 's/.* efer=\(0x[0-9a-fA-F]*\) star=.*/\1/p' <<<"$msrs")"
          star_hex="$(sed -n 's/.* star=\(0x[0-9a-fA-F]*\) lstar=.*/\1/p' <<<"$msrs")"
          lstar_hex="$(sed -n 's/.* lstar=\(0x[0-9a-fA-F]*\) sfmask=.*/\1/p' <<<"$msrs")"
          sfmask_hex="$(sed -n 's/.* sfmask=\(0x[0-9a-fA-F]*\)$/\1/p' <<<"$msrs")"
          for value in "$efer_hex" "$star_hex" "$lstar_hex" "$sfmask_hex"; do
            [[ "$value" =~ ^0x[0-9a-fA-F]+$ ]]
          done
          efer=$((efer_hex))
          star=$((star_hex))
          lstar=$((lstar_hex))
          sfmask=$((sfmask_hex))
          (( (efer & 0x1) == 0x1 ))
          (( star == 0x0013000800000000 ))
          (( lstar == 0x12000 ))
          (( sfmask == 0x200 ))

          good_pte="$(grep -F 'copyout good page PTE:' <<<"$output")"
          handler_pte="$(grep -F 'copyout fault handler PTE:' <<<"$output")"
          observation_pte="$(grep -F 'copyout fault observation PTE:' <<<"$output")"
          good_hex="${good_pte##*: }"
          handler_hex="${handler_pte##*: }"
          observation_hex="${observation_pte##*: }"
          for value in "$good_hex" "$handler_hex" "$observation_hex"; do
            [[ "$value" =~ ^0x[0-9a-fA-F]+$ ]]
          done
          good=$((good_hex))
          handler=$((handler_hex))
          observation=$((observation_hex))
          (( (good & 0x6) == 0x6 ))
          (( (handler & 0x4) == 0 ))
          (( (observation & 0x4) == 0 ))

          terminal="$(grep -F 'copyout terminal: rsp=0x1fdfd8 cs=0x8 rflags=' <<<"$output")"
          terminal_rflags_hex="$(sed -n 's/.* rflags=\(0x[0-9a-fA-F]*\) cr2=.*/\1/p' <<<"$terminal")"
          [[ "$terminal_rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          terminal_rflags=$((terminal_rflags_hex))
          (( (terminal_rflags & 0x2) == 0x2 ))
          (( (terminal_rflags & 0x200) == 0 ))

          report="$(grep -F 'copyout terminal report: rip=0x13005 rflags=' <<<"$output")"
          report_hex="${report##*rflags=}"
          [[ "$report_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          report_flags=$((report_hex))
          (( (report_flags & 0x2) == 0x2 ))
