name: Temporary virtio-blk indirect fixture repair

on:
  push:
    branches:
      - milestone/virtio-blk-indirect-descriptors

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/virtio-blk-indirect-descriptors
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact topology-specific exit-budget repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/portio/virtio_blk_write_readback_fixture.rs")
          text = path.read_text()

          old_budget = "const VIRTIO_BLK_WRITE_READBACK_EXIT_BUDGET: u32 = 44;\n"
          new_budgets = (
              "const VIRTIO_BLK_DIRECT_EXIT_BUDGET: u32 = 44;\n"
              "const VIRTIO_BLK_INDIRECT_EXIT_BUDGET: u32 = 49;\n"
          )
          if old_budget in text:
              text = text.replace(old_budget, new_budgets, 1)
          else:
              assert new_budgets in text, "exit budget constants are neither old nor repaired"

          if "const fn expected_exit_budget" not in text:
              marker = (
                  "    }\n"
                  "}\n\n"
                  "#[derive(Debug, Clone, PartialEq, Eq)]\n"
                  "pub struct VirtioBlkWriteReadbackGuestResult"
              )
              replacement = (
                  "    }\n\n"
                  "    const fn expected_exit_budget(self) -> u32 {\n"
                  "        match self {\n"
                  "            Self::Direct => VIRTIO_BLK_DIRECT_EXIT_BUDGET,\n"
                  "            Self::Indirect => VIRTIO_BLK_INDIRECT_EXIT_BUDGET,\n"
                  "        }\n"
                  "    }\n"
                  "}\n\n"
                  "#[derive(Debug, Clone, PartialEq, Eq)]\n"
                  "pub struct VirtioBlkWriteReadbackGuestResult"
              )
              assert text.count(marker) == 1, "descriptor-topology impl closing marker changed unexpectedly"
              text = text.replace(marker, replacement, 1)

          old_call = "        VIRTIO_BLK_WRITE_READBACK_EXIT_BUDGET,\n"
          new_call = "        topology.expected_exit_budget(),\n"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          else:
              assert new_call in text, "execution budget callsite changed unexpectedly"

          old_name = "fn exit_budget_matches_config_mmio_proof_and_hlt()"
          new_name = "fn exit_budget_matches_topology_specific_config_mmio_proof_and_hlt()"
          if old_name in text:
              text = text.replace(old_name, new_name, 1)
          else:
              assert new_name in text, "exit-budget regression name changed unexpectedly"

          old_assert = "        assert_eq!(VIRTIO_BLK_WRITE_READBACK_EXIT_BUDGET, 14 + 22 + 7 + 1);\n"
          new_asserts = (
              "        assert_eq!(\n"
              "            DescriptorTopology::Direct.expected_exit_budget(),\n"
              "            14 + 22 + 7 + 1\n"
              "        );\n"
              "        assert_eq!(\n"
              "            DescriptorTopology::Indirect.expected_exit_budget(),\n"
              "            14 + 26 + 8 + 1\n"
              "        );\n"
          )
          if old_assert in text:
              text = text.replace(old_assert, new_asserts, 1)
          else:
              assert new_asserts in text, "exit-budget regression body changed unexpectedly"

          path.write_text(text)
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          git diff --check
          cargo check --all-targets --all-features
      - name: Commit permanent milestone source if changed
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/portio/virtio_blk_write_readback_fixture.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix indirect guest exit budget accounting'
          git push origin HEAD:milestone/virtio-blk-indirect-descriptors
