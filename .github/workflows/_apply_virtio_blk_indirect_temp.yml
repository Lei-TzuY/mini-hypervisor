name: Temporary virtio-blk indirect fixture runner

on:
  push:
    branches:
      - milestone/virtio-blk-indirect-descriptors

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/virtio-blk-indirect-descriptors
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply indirect fixture refactor
        run: |
          python3 scripts/_add_virtio_blk_indirect_fixture.py
          python3 scripts/_fix_virtio_blk_indirect_fixture_tests.py
      - name: Format and verify
        run: |
          cargo fmt --all
          git diff --check
          cargo check --all-targets --all-features
      - name: Commit permanent milestone files
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/portio/virtio_blk_write_readback_fixture.rs src/portio/virtio_blk_fixture.rs src/bin/virtio-blk-indirect.rs tests/virtio_blk_indirect_guest.rs .github/workflows/virtio-blk-indirect.yml
          git diff --cached --quiet && exit 1
          git commit -m 'Execute virtio-blk indirect descriptor requests'
          git push origin HEAD:milestone/virtio-blk-indirect-descriptors
