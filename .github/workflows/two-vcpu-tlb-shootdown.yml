name: Strict KVM two-vCPU TLB shootdown

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/portio/two_vcpu_tlb_shootdown_fixture.rs'
      - 'src/portio/two_vcpu_init_sipi_fixture.rs'
      - 'src/portio.rs'
      - 'src/bin/two-vcpu-tlb-shootdown.rs'
      - 'tests/two_vcpu_tlb_shootdown_guest.rs'
      - 'src/interrupt.rs'
      - 'src/kvm/**'
      - 'src/long_mode.rs'
      - 'src/memory.rs'
      - 'src/mmio/long_mode.rs'
      - 'src/vcpu.rs'
      - '.github/workflows/two-vcpu-tlb-shootdown.yml'

permissions:
  contents: read

jobs:
  tlb-shootdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict KVM cross-vCPU TLB shootdown proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s cargo run --quiet --bin two-vcpu-tlb-shootdown)"
          printf '%s\n' "$output"

          grep -F 'TLB shootdown vector: 0x54' <<<"$output"
          grep -F 'TLB shootdown target VA: 0x501000' <<<"$output"
          grep -F 'TLB shootdown target PTE: 0x4808' <<<"$output"
          grep -F 'TLB shootdown initial AP MP state: 1' <<<"$output"
          grep -F 'TLB shootdown startup: rip=0x0 cs=0x800 base=0x8000' <<<"$output"
          grep -F 'TLB shootdown AP IDT: base=0x6000 limit=0x54f' <<<"$output"
          grep -F 'TLB shootdown final PTE: 0x19023' <<<"$output"
          grep -F 'TLB shootdown final ack: 0' <<<"$output"
          grep -F 'TLB shootdown page A: 65' <<<"$output"
          grep -F 'TLB shootdown page B: 66' <<<"$output"
          grep -F 'TLB shootdown BSP proof: [48, 73, 68, 83, 80, 88, 65, 68]' <<<"$output"
          grep -F 'TLB shootdown AP proof: [65, 76, 82, 73, 66, 68]' <<<"$output"

          ready="$(grep -F 'TLB shootdown ready rflags:' <<<"$output")"
          ready_hex="${ready##*: }"
          [[ "$ready_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          ready_flags=$((ready_hex))
          (( (ready_flags & 0x2) == 0x2 ))
          (( (ready_flags & 0x200) == 0 ))

          completion="$(grep -F 'TLB shootdown completion rflags:' <<<"$output")"
          completion_hex="${completion##*: }"
          [[ "$completion_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          completion_flags=$((completion_hex))
          (( (completion_flags & 0x2) == 0x2 ))
          (( (completion_flags & 0x200) == 0x200 ))
