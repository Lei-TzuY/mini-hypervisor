name: Strict KVM two-vCPU AP long-mode IPI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/portio/two_vcpu_init_sipi_fixture.rs'
      - 'src/bin/two-vcpu-ap-long-mode-ipi.rs'
      - 'tests/two_vcpu_ap_long_mode_ipi_guest.rs'
      - 'src/interrupt.rs'
      - 'src/long_mode.rs'
      - 'src/mmio/long_mode.rs'
      - 'src/kvm/mp_state.rs'
      - 'src/vcpu/mp_state.rs'
      - 'src/vcpu/special_register_snapshot.rs'
      - '.github/workflows/two-vcpu-ap-long-mode-ipi.yml'

permissions:
  contents: read

jobs:
  ap-long-mode-ipi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict KVM guest-originated AP long-mode IPI proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s cargo run --quiet --bin two-vcpu-ap-long-mode-ipi)"
          printf '%s\n' "$output"

          grep -F 'AP IPI SIPI vector: 0x8' <<<"$output"
          grep -F 'AP IPI vector: 0x52' <<<"$output"
          grep -F 'AP IPI startup CS selector: 0x800' <<<"$output"
          grep -F 'AP IPI startup CS base: 0x8000' <<<"$output"
          grep -F 'AP IPI stack: 0x1ef000' <<<"$output"
          grep -F 'AP IPI CS selector: 0x8' <<<"$output"
          grep -F 'AP IPI CS.L: 1' <<<"$output"
          grep -F 'AP IPI SS selector: 0x10' <<<"$output"
          grep -F 'AP IPI GDT base: 0x7000' <<<"$output"
          grep -F 'AP IPI GDT limit: 0x17' <<<"$output"
          grep -F 'AP IPI CR3: 0x1000' <<<"$output"
          grep -F 'AP IPI IDT base: 0x6000' <<<"$output"
          grep -F 'AP IPI IDT limit: 0x52f' <<<"$output"
          grep -F 'AP IPI final mp-state: 0' <<<"$output"
          grep -F 'AP IPI marker: 0x4b' <<<"$output"
          grep -F 'AP IPI BSP proof: [48, 73, 68, 83, 88, 77, 68]' <<<"$output"
          grep -F 'AP IPI AP proof: [65, 76, 82, 73, 77, 68]' <<<"$output"

          line="$(grep -F 'AP IPI startup CR0:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          startup_cr0=$((hex))
          (( (startup_cr0 & 0x1) == 0 ))

          line="$(grep -F 'AP IPI CR0:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          cr0=$((hex))
          (( (cr0 & 0x80000001) == 0x80000001 ))

          line="$(grep -F 'AP IPI CR4:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          cr4=$((hex))
          (( (cr4 & 0x20) == 0x20 ))

          line="$(grep -F 'AP IPI EFER:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          efer=$((hex))
          (( (efer & 0x500) == 0x500 ))

          line="$(grep -F 'AP IPI ready rflags:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          ready_rflags=$((hex))
          (( (ready_rflags & 0x2) == 0x2 ))
          (( (ready_rflags & 0x200) == 0 ))

          line="$(grep -F 'AP IPI completion rflags:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          completion_rflags=$((hex))
          (( (completion_rflags & 0x2) == 0x2 ))
          (( (completion_rflags & 0x200) == 0x200 ))
