name: Fold virtio-blk construction modules

on:
  push:
    branches: [milestone/virtio-blk-write-readback]

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/virtio-blk-write-readback
          fetch-depth: 0
      - name: Convert construction includes to permanent modules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e3bcc013a882cd4ce73f91f1bf18f8a31278c1f1"

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/pci/virtio_blk.rs"): [
                  (
                      'mod write_readback {\n    use super::*;\n    include!("virtio_blk_write_readback.rs");\n}\n',
                      'mod virtio_blk_write_readback;\n',
                  ),
                  (
                      'pub use write_readback::VIRTIO_BLK_T_OUT;\n',
                      'pub use virtio_blk_write_readback::VIRTIO_BLK_T_OUT;\n',
                  ),
              ],
              Path("src/portio/virtio_blk_fixture.rs"): [
                  (
                      'mod write_readback {\n    use super::*;\n    include!("virtio_blk_write_readback_fixture.rs");\n}\n',
                      'mod virtio_blk_write_readback_fixture;\n',
                  ),
                  (
                      'pub use write_readback::{\n',
                      'pub use virtio_blk_write_readback_fixture::{\n',
                  ),
              ],
          }
          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one construction fragment in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          for path in [
              Path("src/pci/virtio_blk_write_readback.rs"),
              Path("src/portio/virtio_blk_write_readback_fixture.rs"),
          ]:
              text = path.read_text()
              if text.startswith("use super::*;\n"):
                  raise SystemExit(f"unexpected pre-existing parent import in {path}")
              path.write_text("use super::*;\n\n" + text)
          PY

          git rm .github/workflows/fold-virtio-blk-construction.yml
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          git diff --check

          python3 - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/fold-virtio-blk-construction.yml",
              "src/pci/virtio_blk.rs",
              "src/pci/virtio_blk_write_readback.rs",
              "src/portio/virtio_blk_fixture.rs",
              "src/portio/virtio_blk_write_readback_fixture.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines())
          required = allowed - {".github/workflows/fold-virtio-blk-construction.yml"}
          unexpected = changed - allowed
          missing = required - changed
          if unexpected or missing:
              raise SystemExit(f"cleanup scope mismatch: changed={sorted(changed)}, unexpected={sorted(unexpected)}, missing={sorted(missing)}")
          PY

          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "Replace construction includes with permanent modules"
          git push origin HEAD:milestone/virtio-blk-write-readback
