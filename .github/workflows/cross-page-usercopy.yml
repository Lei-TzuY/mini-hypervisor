name: Strict KVM cross-page usercopy partial progress

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/bin/cross-page-usercopy.rs'
      - 'src/syscall/cross_page.rs'
      - 'src/syscall/mod.rs'
      - 'tests/cross_page_usercopy_guest.rs'
      - 'src/privilege.rs'
      - 'src/kvm/msr.rs'
      - 'src/kvm/msr/**'
      - 'src/vcpu.rs'
      - 'src/vcpu/**'
      - 'src/long_mode.rs'
      - 'src/memory.rs'
      - 'src/lib.rs'
      - 'ROADMAP.md'
      - '.github/workflows/cross-page-usercopy.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict KVM cross-page usercopy partial progress proof
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          cargo build --quiet --bin cross-page-usercopy
          output="$(timeout 30s target/debug/cross-page-usercopy)"
          printf '%s\n' "$output"

          grep -F 'cross-page proof: [75, 75, 75, 68]' <<<"$output"
          grep -F 'cross-page returns: good=4 source_fault=2 destination_fault=2' <<<"$output"
          grep -F 'cross-page good: source=[17, 34, 51, 68] destination=[17, 34, 51, 68]' <<<"$output"
          grep -F 'cross-page source fault: source=[85, 102, 119, 136] destination=[85, 102, 0, 0]' <<<"$output"
          grep -F 'cross-page destination fault: source=[153, 170, 187, 204] destination=[153, 170, 0, 0]' <<<"$output"
          grep -F 'cross-page read fault: cr2=0x25000 error=0x0 rip=0x12013 cs=0x8 rflags=0x10046 fixup=0x12025' <<<"$output"
          grep -F 'cross-page write fault: cr2=0x2b000 error=0x2 rip=0x12018 cs=0x8 rflags=0x10046 fixup=0x12025' <<<"$output"
          grep -F 'cross-page fixup[0]: fault=0x12013 fixup=0x12025 observation=0xb000' <<<"$output"
          grep -F 'cross-page fixup[1]: fault=0x12018 fixup=0x12025 observation=0xb040' <<<"$output"
          grep -F 'cross-page terminal frame: rip=0x1105f cs=0x23 rflags=0x202 rsp=0x1fd000 ss=0x1b' <<<"$output"

          pte_for() {
            local address="$1"
            local line
            line="$(grep -F "cross-page PTE ${address}:" <<<"$output")"
            printf '%s\n' "${line##*: }"
          }
          for address in 0x20000 0x21000 0x22000 0x23000 0x24000 0x26000 0x27000 0x28000 0x29000 0x2a000; do
            pte_hex="$(pte_for "$address")"
            [[ "$pte_hex" =~ ^0x[0-9a-fA-F]+$ ]]
            pte=$((pte_hex))
            (( (pte & 0x7) == 0x7 ))
          done
          for address in 0x25000 0x2b000; do
            pte_hex="$(pte_for "$address")"
            [[ "$pte_hex" =~ ^0x[0-9a-fA-F]+$ ]]
            pte=$((pte_hex))
            (( (pte & 0x1) == 0 ))
            (( (pte & 0x6) == 0x6 ))
          done

          for label in 'cross-page service PTE:' 'cross-page fault handler PTE:' 'cross-page fault metadata PTE:'; do
            line="$(grep -F "$label" <<<"$output")"
            pte_hex="${line##*: }"
            [[ "$pte_hex" =~ ^0x[0-9a-fA-F]+$ ]]
            pte=$((pte_hex))
            (( (pte & 0x1) == 0x1 ))
            (( (pte & 0x4) == 0 ))
          done

          terminal="$(grep -F 'cross-page terminal: rsp=' <<<"$output")"
          [[ "$terminal" == *' cs=0x8 '* ]]
          [[ "$terminal" == *' cr2=0x2b000' ]]
          terminal_rflags_hex="$(sed -n 's/.* rflags=\(0x[0-9a-fA-F]*\) cr2=.*/\1/p' <<<"$terminal")"
          [[ "$terminal_rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          terminal_rflags=$((terminal_rflags_hex))
          (( (terminal_rflags & 0x2) == 0x2 ))
          (( (terminal_rflags & 0x200) == 0 ))

          msrs="$(grep -F 'cross-page MSRs:' <<<"$output")"
          efer_hex="$(sed -n 's/.*efer=\(0x[0-9a-fA-F]*\) star=.*/\1/p' <<<"$msrs")"
          [[ "$efer_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          efer=$((efer_hex))
          (( (efer & 0x1) == 0x1 ))
          [[ "$msrs" == *'star=0x13000800000000'* ]]
          [[ "$msrs" == *'lstar=0x12000'* ]]
          [[ "$msrs" == *'sfmask=0x200'* ]]

          report="$(grep -F 'cross-page terminal report: vCPU 0 exit Hlt: rip=0x13005, rflags=' <<<"$output")"
          report_rflags_hex="${report##*rflags=}"
          [[ "$report_rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          report_rflags=$((report_rflags_hex))
          (( (report_rflags & 0x2) == 0x2 ))
