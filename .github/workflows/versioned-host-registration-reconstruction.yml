name: Strict KVM versioned host-registration reconstruction

on:
  push:
    branches: [main]
    paths:
      - 'src/kvm/host_registration.rs'
      - 'src/kvm/host_registration_schema_v1.rs'
      - 'src/kvm/sys.rs'
      - 'src/pci/virtio_blk_checkpoint.rs'
      - 'src/state_snapshot/page_set/full_controller_virtio_blk_schema_v1.rs'
      - 'src/state_snapshot/page_set/full_controller_virtio_blk_guest.rs'
      - 'src/bin/versioned-host-registration-reconstruction.rs'
      - 'tests/versioned_host_registration_reconstruction_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/versioned-host-registration-reconstruction.yml'
  pull_request:
    paths:
      - 'src/kvm/host_registration.rs'
      - 'src/kvm/host_registration_schema_v1.rs'
      - 'src/kvm/sys.rs'
      - 'src/pci/virtio_blk_checkpoint.rs'
      - 'src/state_snapshot/page_set/full_controller_virtio_blk_schema_v1.rs'
      - 'src/state_snapshot/page_set/full_controller_virtio_blk_guest.rs'
      - 'src/bin/versioned-host-registration-reconstruction.rs'
      - 'tests/versioned_host_registration_reconstruction_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/versioned-host-registration-reconstruction.yml'

permissions:
  contents: read

jobs:
  strict-kvm-versioned-host-registration-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build versioned host-registration reconstruction proof
        run: cargo build --quiet --bin versioned-host-registration-reconstruction
      - name: Execute versioned host-registration reconstruction proof on KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s target/debug/versioned-host-registration-reconstruction)"
          printf '%s\n' "$output"

          checkpoint_schema="$(grep -F 'versioned host reconstruction checkpoint schema: version=1 encoded_bytes=' <<<"$output")"
          checkpoint_bytes="${checkpoint_schema##*encoded_bytes=}"
          [[ "$checkpoint_bytes" =~ ^[0-9]+$ ]]
          (( checkpoint_bytes > 2048 ))

          grep -F 'versioned host reconstruction registration schema: version=1 encoded_bytes=48 canonical=true' <<<"$output"
          grep -F 'versioned host reconstruction checkpoint page: 0x18000' <<<"$output"
          grep -F 'versioned host reconstruction descriptor: doorbell=0x10000100 len=2 datamatch=0x0 gsi=0' <<<"$output"
          grep -F 'queue=0/0' <<<"$(grep -F 'versioned host reconstruction capture:' <<<"$output")"
          grep -F 'versioned host reconstruction mutation exact: page=false vcpu=false master-pic=false slave-pic=false ioapic=false lapic=false device=false' <<<"$output"
          grep -F 'versioned host reconstruction mutation transport: doorbell-events=1 irqfd-signals=1' <<<"$output"
          grep -F 'versioned host reconstruction mutation proof: [78, 73, 65, 82, 68]' <<<"$output"
          grep -F 'versioned host reconstruction restore exact: page=true vcpu=true master-pic=true slave-pic=true ioapic=true lapic=true device=true' <<<"$output"
          grep -F 'versioned host reconstruction replay transport: doorbell-events=1 irqfd-signals=1' <<<"$output"
          grep -F 'versioned host reconstruction replay queue: avail=1 used=1' <<<"$output"
          grep -F 'versioned host reconstruction replay proof: [78, 73, 65, 82, 68]' <<<"$output"
          grep -F 'versioned host reconstruction backing/readback match: true' <<<"$output"

          capture="$(grep -F 'versioned host reconstruction capture:' <<<"$output")"
          capture_rflags_hex="${capture##*rflags=}"
          capture_rflags_hex="${capture_rflags_hex%% *}"
          [[ "$capture_rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          capture_rflags=$((capture_rflags_hex))
          (( (capture_rflags & 0x2) == 0x2 ))
          (( (capture_rflags & 0x200) == 0x200 ))

          replay="$(grep -F 'versioned host reconstruction replay rflags:' <<<"$output")"
          replay_rflags_hex="${replay##*: }"
          [[ "$replay_rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          replay_rflags=$((replay_rflags_hex))
          (( (replay_rflags & 0x2) == 0x2 ))
          (( (replay_rflags & 0x200) == 0x200 ))
