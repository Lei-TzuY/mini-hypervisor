name: Wire virtio-blk multi-sector backing v2

on:
  push:
    branches: [milestone/virtio-blk-multi-sector]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/virtio-blk-multi-sector
          fetch-depth: 0
      - name: Wire bounded backing into both queue processors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ddfcd0b34da30de0353e3f087d4eb4628c3a313e"

          python3 - <<'PY'
          from pathlib import Path

          parent = Path("src/pci/virtio_blk.rs")
          text = parent.read_text()
          edits = [
              ('#[path = "virtio_blk_write_readback.rs"]\nmod write_readback;\n\npub use write_readback::VIRTIO_BLK_T_OUT;\n', 'mod virtio_blk_backing;\n#[path = "virtio_blk_write_readback.rs"]\nmod write_readback;\n\npub use virtio_blk_backing::{VIRTIO_BLK_BACKING_SIZE, VIRTIO_BLK_CAPACITY_SECTORS};\npub use write_readback::VIRTIO_BLK_T_OUT;\n'),
              ('pub const VIRTIO_BLK_CAPACITY_SECTORS: u64 = 1;\n', ''),
              ('    SectorOutOfRange {\n        sector: u64,\n        capacity: u64,\n    },\n    AddressOverflow {\n', '    SectorOutOfRange {\n        sector: u64,\n        capacity: u64,\n    },\n    InvalidDataLength {\n        length: u32,\n        sector_size: u32,\n    },\n    RequestRangeOutOfRange {\n        sector: u64,\n        data_length: u32,\n        capacity: u64,\n    },\n    AddressOverflow {\n'),
              ('            Self::SectorOutOfRange { sector, capacity } => write!(\n                f,\n                "virtio-blk sector {sector} is outside capacity {capacity} sectors"\n            ),\n            Self::AddressOverflow { base, offset } => write!(\n', '            Self::SectorOutOfRange { sector, capacity } => write!(\n                f,\n                "virtio-blk sector {sector} is outside capacity {capacity} sectors"\n            ),\n            Self::InvalidDataLength {\n                length,\n                sector_size,\n            } => write!(\n                f,\n                "virtio-blk data length {length} is not a non-zero multiple of sector size {sector_size}"\n            ),\n            Self::RequestRangeOutOfRange {\n                sector,\n                data_length,\n                capacity,\n            } => write!(\n                f,\n                "virtio-blk request at sector {sector} with {data_length} data bytes exceeds capacity {capacity} sectors"\n            ),\n            Self::AddressOverflow { base, offset } => write!(\n'),
              ('    sector0: [u8; VIRTIO_BLK_SECTOR_SIZE],\n', '    backing: [u8; VIRTIO_BLK_BACKING_SIZE],\n'),
              ('            sector0: deterministic_sector(),\n', '            backing: virtio_blk_backing::deterministic_backing(),\n'),
              ('        if sector >= VIRTIO_BLK_CAPACITY_SECTORS {\n            return Err(VirtioBlkError::SectorOutOfRange {\n                sector,\n                capacity: VIRTIO_BLK_CAPACITY_SECTORS,\n            }\n            .into());\n        }\n\n        let used_idx = read_guest_u16(memory, checked_add(self.queue_device, 2)?)?;\n', '        let backing_range = self.request_backing_range(sector, data.length)?;\n\n        let used_idx = read_guest_u16(memory, checked_add(self.queue_device, 2)?)?;\n'),
              ('        memory.write(GuestPhysAddr::new(data.address), &self.sector0)?;\n', '        memory.write(GuestPhysAddr::new(data.address), &self.backing[backing_range])?;\n'),
              ('        let written = (VIRTIO_BLK_SECTOR_SIZE + 1) as u32;\n', '        let written = data.length + 1;\n'),
              ('    fn capacity_register_is_one_sector_and_sector_payload_is_stable() {\n', '    fn capacity_register_matches_bounded_backing_and_sector0_payload_is_stable() {\n'),
              ('            1_u64.to_le_bytes()\n', '            VIRTIO_BLK_CAPACITY_SECTORS.to_le_bytes()\n'),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f"virtio_blk.rs expected one match, got {text.count(old)} for {old[:80]!r}")
              text = text.replace(old, new, 1)
          parent.write_text(text)

          atomic = Path("src/pci/virtio_blk_write_readback.rs")
          text = atomic.read_text()
          edits = [
              ('    pub const fn sector0(&self) -> &[u8; VIRTIO_BLK_SECTOR_SIZE] {\n        &self.sector0\n    }\n', '    pub fn sector0(&self) -> &[u8; VIRTIO_BLK_SECTOR_SIZE] {\n        self.backing[..VIRTIO_BLK_SECTOR_SIZE]\n            .try_into()\n            .expect("sector0 range has fixed sector size")\n    }\n'),
              ('        if sector >= VIRTIO_BLK_CAPACITY_SECTORS {\n            return Err(VirtioBlkError::SectorOutOfRange {\n                sector,\n                capacity: VIRTIO_BLK_CAPACITY_SECTORS,\n            }\n            .into());\n        }\n\n        let expected_data_flags = if request_type == VIRTIO_BLK_T_IN {\n', '        let backing_range = self.request_backing_range(sector, data.length)?;\n\n        let expected_data_flags = if request_type == VIRTIO_BLK_T_IN {\n'),
              ('        let mut outgoing_sector = None;\n        if request_type == VIRTIO_BLK_T_OUT {\n            let mut bytes = [0_u8; VIRTIO_BLK_SECTOR_SIZE];\n            memory.read(GuestPhysAddr::new(data.address), &mut bytes)?;\n            outgoing_sector = Some(bytes);\n        } else {\n            preflight_guest_output(memory, data.address, VIRTIO_BLK_SECTOR_SIZE)?;\n        }\n', '        let mut outgoing_data = None;\n        if request_type == VIRTIO_BLK_T_OUT {\n            let mut bytes = vec![0_u8; data.length as usize];\n            memory.read(GuestPhysAddr::new(data.address), &mut bytes)?;\n            outgoing_data = Some(bytes);\n        } else {\n            preflight_guest_output(memory, data.address, data.length as usize)?;\n        }\n'),
              ('        let written = if request_type == VIRTIO_BLK_T_IN {\n            let sector_bytes = self.sector0;\n            memory.write(GuestPhysAddr::new(data.address), &sector_bytes)?;\n            (VIRTIO_BLK_SECTOR_SIZE + 1) as u32\n        } else {\n            1\n        };\n', '        let written = if request_type == VIRTIO_BLK_T_IN {\n            memory.write(\n                GuestPhysAddr::new(data.address),\n                &self.backing[backing_range.clone()],\n            )?;\n            data.length + 1\n        } else {\n            1\n        };\n'),
              ('        if let Some(bytes) = outgoing_sector {\n            self.sector0 = bytes;\n        }\n', '        if let Some(bytes) = outgoing_data {\n            self.backing[backing_range].copy_from_slice(&bytes);\n        }\n'),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f"virtio_blk_write_readback.rs expected one match, got {text.count(old)} for {old[:80]!r}")
              text = text.replace(old, new, 1)
          atomic.write_text(text)
          PY

          git rm .github/workflows/wire-virtio-blk-multi-sector.yml .github/workflows/wire-virtio-blk-multi-sector-v2.yml
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          git diff --check

          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/pci/virtio_blk.rs src/pci/virtio_blk_write_readback.rs src/pci/virtio_blk_backing.rs
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          for required in ".github/workflows/wire-virtio-blk-multi-sector-v2.yml" ".github/workflows/wire-virtio-blk-multi-sector.yml" "src/pci/virtio_blk.rs" "src/pci/virtio_blk_backing.rs" "src/pci/virtio_blk_write_readback.rs"; do
            grep -Fx "$required" <<<"$staged"
          done
          test "$(wc -l <<<"$staged")" -eq 5
          git commit -m "Wire bounded multi-sector virtio-blk backing"
          git push origin HEAD:milestone/virtio-blk-multi-sector
