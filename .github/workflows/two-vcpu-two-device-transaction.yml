name: Strict KVM two-vCPU two-device transaction

on:
  push:
    branches: [main]
    paths:
      - 'src/state_snapshot.rs'
      - 'src/state_snapshot/page_set.rs'
      - 'src/state_snapshot/two_vcpu_checkpoint.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk.rs'
      - 'src/state_snapshot/page_set/two_vcpu_two_device_transaction.rs'
      - 'src/state_snapshot/page_set/two_vcpu_two_device_transaction_guest.rs'
      - 'src/kvm/host_registration.rs'
      - 'src/kvm/host_registration_pair.rs'
      - 'src/kvm/irqchip_snapshot.rs'
      - 'src/vcpu/lapic_checkpoint.rs'
      - 'src/vcpu/mp_state.rs'
      - 'src/bin/two-vcpu-two-device-transaction.rs'
      - 'tests/two_vcpu_two_device_transaction_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/two-vcpu-two-device-transaction.yml'
  pull_request:
    paths:
      - 'src/state_snapshot.rs'
      - 'src/state_snapshot/page_set.rs'
      - 'src/state_snapshot/two_vcpu_checkpoint.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk.rs'
      - 'src/state_snapshot/page_set/two_vcpu_two_device_transaction.rs'
      - 'src/state_snapshot/page_set/two_vcpu_two_device_transaction_guest.rs'
      - 'src/kvm/host_registration.rs'
      - 'src/kvm/host_registration_pair.rs'
      - 'src/kvm/irqchip_snapshot.rs'
      - 'src/vcpu/lapic_checkpoint.rs'
      - 'src/vcpu/mp_state.rs'
      - 'src/bin/two-vcpu-two-device-transaction.rs'
      - 'tests/two_vcpu_two_device_transaction_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/two-vcpu-two-device-transaction.yml'

permissions:
  contents: read

jobs:
  strict-kvm-two-vcpu-two-device-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build two-vCPU two-device transaction proof
        run: cargo build --quiet --bin two-vcpu-two-device-transaction
      - name: Execute two-vCPU two-device transaction proof on KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s target/debug/two-vcpu-two-device-transaction)"
          printf '%s\n' "$output"

          grep -F 'two-vCPU two-device bars: 0x10000000,0x10001000' <<<"$output"
          grep -F 'two-vCPU two-device statuses: captured=[1, 3] restored=[1, 3]' <<<"$output"
          grep -F 'two-vCPU two-device quiescence: capture=[false, false] reconstructed=[false, false]' <<<"$output"
          grep -F 'two-vCPU two-device mutation: shared=Some(false) first-stack=Some(false) second-stack=Some(false) vcpu0=Some(false) vcpu1=Some(false) mp0=Some(false) mp1=Some(false) master=false slave=false ioapic=false lapic0=Some(false) lapic1=Some(false) dev0=Some(false) dev1=Some(false)' <<<"$output"
          grep -F 'two-vCPU two-device restore: shared=Some(true) first-stack=Some(true) second-stack=Some(true) vcpu0=Some(true) vcpu1=Some(true) mp0=Some(true) mp1=Some(true) master=true slave=true ioapic=true lapic0=Some(true) lapic1=Some(true) dev0=Some(true) dev1=Some(true)' <<<"$output"
          grep -F 'two-vCPU two-device capture rips: 0x1000e,0x11006' <<<"$output"
          grep -F 'two-vCPU two-device completion rips: 0x10023,0x1101b' <<<"$output"
          grep -F 'two-vCPU two-device proofs: [48],[49]' <<<"$output"
