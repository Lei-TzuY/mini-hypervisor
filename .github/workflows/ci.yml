      - name: Strict KVM virtio-rng PCI request proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(cargo run --quiet --bin virtio-rng-pci-request)"
          printf '%s\n' "$output"
          grep -F 'virtio-rng PCI identity: vendor=0x1af4 device=0x1044' <<<"$output"
          grep -F 'virtio-rng BAR0: 0x10000000' <<<"$output"
          grep -F 'virtio-rng driver features: 0x100000000' <<<"$output"
          grep -F 'virtio-rng device status: 0x0f' <<<"$output"
          grep -F 'virtio-rng queue enabled: true' <<<"$output"
          grep -F 'virtio-rng used: idx=1 id=0 len=8' <<<"$output"
          grep -F 'virtio-rng payload: [82, 78, 71, 68, 65, 84, 65, 33]' <<<"$output"
          grep -F 'virtio-rng proof: [80, 86, 78, 82]' <<<"$output"
          grep -F 'virtio-rng port-I/O exits: 16' <<<"$output"
          grep -F 'virtio-rng MMIO exits: 19' <<<"$output"
          report="$(grep -F 'vCPU 0 exit Hlt: rip=' <<<"$output")"
          rflags_hex="${report##*rflags=}"
          [[ "$rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          rflags=$((rflags_hex))
          (( (rflags & 0x2) == 0x2 ))
      - name: Strict KVM virtio-rng completion interrupt proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(cargo run --quiet --bin virtio-rng-completion-interrupt)"
          printf '%s\n' "$output"
          grep -F 'virtio-rng interrupt GSI: 0' <<<"$output"
          grep -F 'virtio-rng interrupt vector: 0x40' <<<"$output"
          grep -F 'virtio-rng interrupt lifecycle: assert=1 deassert=1' <<<"$output"
          grep -F 'virtio-rng interrupt used: idx=1 id=0 len=8' <<<"$output"
          grep -F 'virtio-rng interrupt payload: [82, 78, 71, 68, 65, 84, 65, 33]' <<<"$output"
          grep -F 'virtio-rng interrupt proof: [80, 86, 78, 73, 65, 82]' <<<"$output"
          grep -F 'virtio-rng interrupt port-I/O exits: 18' <<<"$output"
          grep -F 'virtio-rng interrupt MMIO exits: 21' <<<"$output"
          spiv_line="$(grep -F 'virtio-rng interrupt LAPIC SPIV:' <<<"$output")"
          spiv_hex="${spiv_line##*: }"
          [[ "$spiv_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          spiv=$((spiv_hex))
          (( (spiv & 0x100) == 0x100 ))
          lint0_line="$(grep -F 'virtio-rng interrupt LAPIC LINT0:' <<<"$output")"
          lint0_hex="${lint0_line##*: }"
          [[ "$lint0_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          lint0=$((lint0_hex))
          (( (lint0 & 0x700) == 0x700 ))
          (( (lint0 & 0x10000) == 0 ))
          report="$(grep -F 'vCPU 0 exit Hlt: rip=' <<<"$output")"
          rflags_hex="${report##*rflags=}"
          [[ "$rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          rflags=$((rflags_hex))
          (( (rflags & 0x2) == 0x2 ))
          (( (rflags & 0x200) == 0x200 ))

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.74.0
      - name: Check MSRV shipped targets
        # The manifest's rust-version contract applies to shipped library/binary targets.
        # Stable CI above still compiles and executes every test target.
        run: cargo check --all-features
