name: Strict KVM bounded wait channel

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/task.rs'
      - 'src/task/runnable_queue.rs'
      - 'src/task/wait_channel.rs'
      - 'src/bin/task-wait-channel.rs'
      - 'tests/task_wait_channel_guest.rs'
      - 'src/address_space.rs'
      - 'src/privilege.rs'
      - 'src/interrupt.rs'
      - 'src/kvm/**'
      - 'src/vcpu.rs'
      - 'src/vcpu/**'
      - 'src/long_mode.rs'
      - 'src/memory.rs'
      - 'src/lib.rs'
      - 'ROADMAP.md'
      - '.github/workflows/task-wait-channel.yml'

permissions:
  contents: read

jobs:
  task-wait-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bounded wait-channel proof
        run: cargo build --quiet --bin task-wait-channel
      - name: Strict KVM bounded wait-channel proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s target/debug/task-wait-channel)"
          printf '%s\n' "$output"

          grep -F 'wait channel GSI: 0' <<<"$output"
          grep -F 'wait channel vector: 0x40' <<<"$output"
          grep -F 'wait channel blocked: state=Blocked owner=0x11 mismatches=0 wakes=0 last=0x0' <<<"$output"
          grep -F 'wait channel mismatch: state=Blocked owner=0x11 mismatches=1 wakes=0 last=0x22' <<<"$output"
          grep -F 'wait channel wake: state=Runnable owner=0x0 mismatches=1 wakes=1 last=0x11' <<<"$output"
          grep -F 'wait channel final: state=Runnable owner=0x0 mismatches=1 wakes=1 last=0x11' <<<"$output"
          grep -F 'wait channel first selection: entry0=A entry1=B head=0 selected=B skips=1 A=Blocked B=Runnable' <<<"$output"
          grep -F 'wait channel second selection: entry0=A entry1=B head=1 selected=A skips=1 A=Runnable B=Runnable' <<<"$output"

          spiv_line="$(grep -F 'wait channel LAPIC SPIV:' <<<"$output")"
          spiv_hex="${spiv_line##*: }"
          [[ "$spiv_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          spiv=$((spiv_hex))
          (( (spiv & 0x100) == 0x100 ))

          lint0_line="$(grep -F 'wait channel LAPIC LINT0:' <<<"$output")"
          lint0_hex="${lint0_line##*: }"
          [[ "$lint0_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          lint0=$((lint0_hex))
          (( (lint0 & 0x700) == 0x700 ))
          (( (lint0 & 0x10000) == 0 ))

          armed_line="$(grep -F 'wait channel armed rflags:' <<<"$output")"
          armed_hex="${armed_line##*: }"
          [[ "$armed_hex" =~ ^0x[0-9a-fA-F]+$ ]]
          armed=$((armed_hex))
          (( (armed & 0x2) == 0x2 ))
          (( (armed & 0x200) == 0 ))

          grep -F 'wait channel A context: cr3=0x1000 rip=0x11011 rsp=0x1fcff0 rflags=0x202 r12=0x1111 saves=1' <<<"$output"
          grep -F 'wait channel B context: cr3=0xb000 rip=0x11013 rsp=0x1fcfd0 rflags=0x202 r12=0x2223 saves=1' <<<"$output"
          grep -F 'wait channel terminal: cr3=0x1000 rip=0x11013 rsp=0x1fcff0 r12=0x1111' <<<"$output"
          grep -F 'wait channel final registers: cr3=0x1000 r12=0x1111' <<<"$output"
          grep -F 'wait channel stack markers: first=97 second=98' <<<"$output"
          grep -F 'wait channel proof: [75, 49, 65, 88, 80, 87, 48, 66, 82, 68]' <<<"$output"

          check_context_pte() {
            label="$1"
            line="$(grep -F "$label" <<<"$output")"
            value_hex="${line##*: }"
            [[ "$value_hex" =~ ^0x[0-9a-fA-F]+$ ]]
            value=$((value_hex))
            (( (value & 0x000ffffffffff000) == 0x30000 ))
            (( (value & 0x1) == 0x1 ))
            (( (value & 0x2) == 0x2 ))
            (( (value & 0x4) == 0 ))
          }

          check_context_pte 'wait channel A context PTE:'
          check_context_pte 'wait channel B context PTE:'
