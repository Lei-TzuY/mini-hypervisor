name: One-shot Clippy fixer

on:
  push:
    branches:
      - milestone/virtio-rng-pci-request

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Collapse DRIVER_OK validation and remove fixer workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: milestone/virtio-rng-pci-request
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact Clippy fix and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pci/virtio.rs')
          text = path.read_text()
          old = '''        if requested & VIRTIO_STATUS_DRIVER_OK != 0 {\n            if requested & VIRTIO_STATUS_FEATURES_OK == 0 || !self.queue_enabled {\n                return Err(VirtioRngError::InvalidDeviceStatus {\n                    current: self.status,\n                    requested,\n                });\n            }\n        }\n'''
          new = '''        if requested & VIRTIO_STATUS_DRIVER_OK != 0\n            && (requested & VIRTIO_STATUS_FEATURES_OK == 0 || !self.queue_enabled)\n        {\n            return Err(VirtioRngError::InvalidDeviceStatus {\n                current: self.status,\n                requested,\n            });\n        }\n'''
          if old not in text:
              raise SystemExit('expected DRIVER_OK validation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git rm .github/workflows/clippy-fix.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'Collapse DRIVER_OK validation and remove fixer workflow'
          git push origin HEAD:milestone/virtio-rng-pci-request
