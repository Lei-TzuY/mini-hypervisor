name: Strict KVM two-vCPU AP long mode

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/portio/two_vcpu_init_sipi_fixture.rs'
      - 'src/bin/two-vcpu-ap-long-mode.rs'
      - 'tests/two_vcpu_ap_long_mode_guest.rs'
      - 'src/long_mode.rs'
      - 'src/mmio/long_mode.rs'
      - 'src/kvm/mp_state.rs'
      - 'src/vcpu/mp_state.rs'
      - 'src/vcpu/special_register_snapshot.rs'
      - '.github/workflows/two-vcpu-ap-long-mode.yml'

permissions:
  contents: read

jobs:
  ap-long-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict KVM guest-driven AP long-mode proof
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s cargo run --quiet --bin two-vcpu-ap-long-mode)"
          printf '%s\n' "$output"
          grep -F 'AP long-mode SIPI vector: 0x8' <<<"$output"
          grep -F 'AP long-mode startup CS selector: 0x800' <<<"$output"
          grep -F 'AP long-mode startup CS base: 0x8000' <<<"$output"
          grep -F 'AP long-mode stack: 0x1ef000' <<<"$output"
          grep -F 'AP long-mode CS selector: 0x8' <<<"$output"
          grep -F 'AP long-mode CS.L: 1' <<<"$output"
          grep -F 'AP long-mode SS selector: 0x10' <<<"$output"
          grep -F 'AP long-mode GDT base: 0x7000' <<<"$output"
          grep -F 'AP long-mode GDT limit: 0x17' <<<"$output"
          grep -F 'AP long-mode CR3: 0x1000' <<<"$output"
          grep -F 'AP long-mode final mp-state: 0' <<<"$output"
          grep -F 'AP long-mode marker: 0x4b' <<<"$output"
          grep -F 'AP long-mode BSP proof: [48, 73, 68, 83, 77, 68]' <<<"$output"
          grep -F 'AP long-mode AP proof: [65, 76, 80, 68]' <<<"$output"

          line="$(grep -F 'AP long-mode startup CR0:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          startup_cr0=$((hex))
          (( (startup_cr0 & 0x1) == 0 ))

          line="$(grep -F 'AP long-mode CR0:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          cr0=$((hex))
          (( (cr0 & 0x80000001) == 0x80000001 ))

          line="$(grep -F 'AP long-mode CR4:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          cr4=$((hex))
          (( (cr4 & 0x20) == 0x20 ))

          line="$(grep -F 'AP long-mode EFER:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          efer=$((hex))
          (( (efer & 0x500) == 0x500 ))

          line="$(grep -F 'AP long-mode completion rflags:' <<<"$output")"
          hex="${line##*: }"
          [[ "$hex" =~ ^0x[0-9a-fA-F]+$ ]]
          rflags=$((hex))
          (( (rflags & 0x2) == 0x2 ))
          (( (rflags & 0x200) == 0 ))
