name: Strict KVM two-device checkpoint transaction

on:
  push:
    branches: [main]
    paths:
      - 'src/kvm/sys.rs'
      - 'src/kvm/irqchip.rs'
      - 'src/kvm/irqfd_timer.rs'
      - 'src/kvm/ioeventfd_roundtrip.rs'
      - 'src/kvm/host_registration.rs'
      - 'src/kvm/host_registration_pair.rs'
      - 'src/kvm/host_registration_schema_v1.rs'
      - 'src/kvm/host_registration_pair_schema_v1.rs'
      - 'src/mmio.rs'
      - 'src/mmio/multi_device/virtio_blk_atomic_bus.rs'
      - 'src/mmio/routing.rs'
      - 'src/pci/virtio_blk.rs'
      - 'src/pci/virtio_blk_checkpoint.rs'
      - 'src/state_snapshot/page_set.rs'
      - 'src/state_snapshot/page_set/controller.rs'
      - 'src/state_snapshot/page_set/full_controller.rs'
      - 'src/state_snapshot/page_set/full_controller_schema_v1.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk_schema_v1.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk_guest.rs'
      - 'src/state_snapshot/page_set/two_device_checkpoint_transaction_schema_v1.rs'
      - 'src/bin/two-device-checkpoint-transaction.rs'
      - 'tests/two_device_checkpoint_transaction_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/two-device-checkpoint-transaction.yml'
  pull_request:
    paths:
      - 'src/kvm/sys.rs'
      - 'src/kvm/irqchip.rs'
      - 'src/kvm/irqfd_timer.rs'
      - 'src/kvm/ioeventfd_roundtrip.rs'
      - 'src/kvm/host_registration.rs'
      - 'src/kvm/host_registration_pair.rs'
      - 'src/kvm/host_registration_schema_v1.rs'
      - 'src/kvm/host_registration_pair_schema_v1.rs'
      - 'src/mmio.rs'
      - 'src/mmio/multi_device/virtio_blk_atomic_bus.rs'
      - 'src/mmio/routing.rs'
      - 'src/pci/virtio_blk.rs'
      - 'src/pci/virtio_blk_checkpoint.rs'
      - 'src/state_snapshot/page_set.rs'
      - 'src/state_snapshot/page_set/controller.rs'
      - 'src/state_snapshot/page_set/full_controller.rs'
      - 'src/state_snapshot/page_set/full_controller_schema_v1.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk_schema_v1.rs'
      - 'src/state_snapshot/page_set/full_controller_two_virtio_blk_guest.rs'
      - 'src/state_snapshot/page_set/two_device_checkpoint_transaction_schema_v1.rs'
      - 'src/bin/two-device-checkpoint-transaction.rs'
      - 'tests/two_device_checkpoint_transaction_guest.rs'
      - 'ROADMAP.md'
      - '.github/workflows/two-device-checkpoint-transaction.yml'

permissions:
  contents: read

jobs:
  strict-kvm-two-device-checkpoint-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build two-device transaction proof
        run: cargo build --quiet --bin two-device-checkpoint-transaction
      - name: Execute two-device transaction proof on KVM
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          output="$(timeout 30s target/debug/two-device-checkpoint-transaction)"
          printf '%s\n' "$output"

          schema="$(grep -F 'two-device transaction schema:' <<<"$output")"
          encoded="$(sed -n 's/.*encoded_bytes=\([0-9][0-9]*\).*/\1/p' <<<"$schema")"
          checkpoint="$(sed -n 's/.*checkpoint_bytes=\([0-9][0-9]*\).*/\1/p' <<<"$schema")"
          pair="$(sed -n 's/.*registration_pair_bytes=\([0-9][0-9]*\).*/\1/p' <<<"$schema")"
          [[ "$encoded" =~ ^[0-9]+$ ]]
          [[ "$checkpoint" =~ ^[0-9]+$ ]]
          [[ "$pair" =~ ^[0-9]+$ ]]
          (( encoded == checkpoint + pair + 48 ))
          (( pair == 128 ))
          grep -F 'version=1' <<<"$schema"
          grep -F 'checkpoint_version=1' <<<"$schema"
          grep -F 'registration_pair_version=1' <<<"$schema"
          grep -F 'registration_versions=[1, 1]' <<<"$schema"
          grep -F 'bars=[268435456, 268439552]' <<<"$schema"
          grep -F 'canonical=true' <<<"$schema"

          grep -F 'two-device transaction captured statuses: [1, 3]' <<<"$output"
          grep -F 'two-device transaction mutation exact: page=false vcpu=false master-pic=false slave-pic=false ioapic=false lapic=false first=false second=false' <<<"$output"
          grep -F 'two-device transaction restore exact: page=true vcpu=true master-pic=true slave-pic=true ioapic=true lapic=true first=true second=true' <<<"$output"
          grep -F 'two-device transaction restored statuses: [1, 3]' <<<"$output"
          grep -F 'two-device transaction checkpoint proof: [65, 83, 66, 74, 77, 68]' <<<"$output"

          grep -F 'two-device transaction acceleration: doorbells=[268435712, 268439808] gsis=[0, 1] vectors=[64, 65] events=[[1, 1], [1, 1]]' <<<"$output"
          grep -F 'two-device transaction acceleration proof: [82, 65, 48, 77, 66, 49, 78, 67, 69, 48, 80, 70, 49, 81, 68]' <<<"$output"

          for prefix in 'two-device transaction checkpoint rflags:' 'two-device transaction acceleration rflags:'; do
            line="$(grep -F "$prefix" <<<"$output")"
            rflags_hex="${line##*: }"
            [[ "$rflags_hex" =~ ^0x[0-9a-fA-F]+$ ]]
            rflags=$((rflags_hex))
            (( (rflags & 0x2) == 0x2 ))
            (( (rflags & 0x200) == 0x200 ))
          done
